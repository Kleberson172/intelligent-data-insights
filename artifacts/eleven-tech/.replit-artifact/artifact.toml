kind = "web"
previewPath = "/"
title = "ELEVEN Technology"
version = "1.0.0"
id = "artifacts/eleven-tech"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25453

[services.development]
run = "pnpm --filter @workspace/eleven-tech run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/eleven-tech", "run", "build" ]
publicDir = "artifacts/eleven-tech/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25453"
BASE_PATH = "/"
