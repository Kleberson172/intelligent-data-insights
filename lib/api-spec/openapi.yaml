openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: ELEVEN Technology - Intelligent Data Analysis API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: openai
    description: OpenAI AI chat operations
  - name: dashboard
    description: Dashboard analytics and data
  - name: predictions
    description: Predictive analytics
  - name: anomalies
    description: Anomaly detection
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /openai/conversations:
    get:
      operationId: listOpenaiConversations
      tags: [openai]
      summary: List all conversations
      responses:
        "200":
          description: List of conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OpenaiConversation"
    post:
      operationId: createOpenaiConversation
      tags: [openai]
      summary: Create a new conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConversationInput"
      responses:
        "201":
          description: Created conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiConversation"

  /openai/conversations/{id}:
    get:
      operationId: getOpenaiConversation
      tags: [openai]
      summary: Get conversation with messages
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Conversation with messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiConversationWithMessages"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
    delete:
      operationId: deleteOpenaiConversation
      tags: [openai]
      summary: Delete a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"

  /openai/conversations/{id}/messages:
    get:
      operationId: listOpenaiMessages
      tags: [openai]
      summary: List messages in a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OpenaiMessage"
    post:
      operationId: sendOpenaiMessage
      tags: [openai]
      summary: Send a text message and receive a streaming text response
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageInput"
      responses:
        "200":
          description: SSE stream of assistant text chunks
          content:
            text/event-stream: {}

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get high-level KPI summary
      responses:
        "200":
          description: Dashboard summary metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /dashboard/sales:
    get:
      operationId: getSalesData
      tags: [dashboard]
      summary: Get monthly sales data for charts
      responses:
        "200":
          description: Sales time series data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SalesDataPoint"

  /dashboard/sales-by-province:
    get:
      operationId: getSalesByProvince
      tags: [dashboard]
      summary: Get sales broken down by province
      responses:
        "200":
          description: Sales by province
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProvinceDataPoint"

  /dashboard/top-products:
    get:
      operationId: getTopProducts
      tags: [dashboard]
      summary: Get top performing products
      responses:
        "200":
          description: Top products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProductDataPoint"

  /predictions/forecast:
    get:
      operationId: getSalesForecast
      tags: [predictions]
      summary: Get sales forecast for next months
      responses:
        "200":
          description: Sales forecast data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ForecastDataPoint"

  /predictions/confidence:
    get:
      operationId: getPredictionConfidence
      tags: [predictions]
      summary: Get model confidence and accuracy metrics
      responses:
        "200":
          description: Prediction confidence metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PredictionConfidence"

  /anomalies:
    get:
      operationId: getAnomalies
      tags: [anomalies]
      summary: Get detected anomalies in the dataset
      responses:
        "200":
          description: List of detected anomalies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Anomaly"

  /anomalies/stats:
    get:
      operationId: getAnomalyStats
      tags: [anomalies]
      summary: Get anomaly detection statistics
      responses:
        "200":
          description: Anomaly statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnomalyStats"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    OpenaiConversation:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - createdAt

    OpenaiMessage:
      type: object
      properties:
        id:
          type: integer
        conversationId:
          type: integer
        role:
          type: string
        content:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - conversationId
        - role
        - content
        - createdAt

    ConversationInput:
      type: object
      properties:
        title:
          type: string
      required:
        - title

    MessageInput:
      type: object
      properties:
        content:
          type: string
      required:
        - content

    OpenaiConversationWithMessages:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        createdAt:
          type: string
          format: date-time
        messages:
          type: array
          items:
            $ref: "#/components/schemas/OpenaiMessage"
      required:
        - id
        - title
        - createdAt
        - messages

    OpenaiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    DashboardSummary:
      type: object
      properties:
        totalRevenue:
          type: number
        totalOrders:
          type: integer
        avgOrderValue:
          type: number
        growthRate:
          type: number
        activeClients:
          type: integer
        anomaliesDetected:
          type: integer
      required:
        - totalRevenue
        - totalOrders
        - avgOrderValue
        - growthRate
        - activeClients
        - anomaliesDetected

    SalesDataPoint:
      type: object
      properties:
        month:
          type: string
        vendas:
          type: number
        despesas:
          type: number
        lucro:
          type: number
      required:
        - month
        - vendas
        - despesas
        - lucro

    ProvinceDataPoint:
      type: object
      properties:
        provincia:
          type: string
        vendas:
          type: number
        percentagem:
          type: number
      required:
        - provincia
        - vendas
        - percentagem

    ProductDataPoint:
      type: object
      properties:
        produto:
          type: string
        vendas:
          type: number
        unidades:
          type: integer
        crescimento:
          type: number
      required:
        - produto
        - vendas
        - unidades
        - crescimento

    ForecastDataPoint:
      type: object
      properties:
        month:
          type: string
        previsto:
          type: number
        minimo:
          type: number
        maximo:
          type: number
        real:
          type: ["number", "null"]
      required:
        - month
        - previsto
        - minimo
        - maximo
        - real

    PredictionConfidence:
      type: object
      properties:
        accuracy:
          type: number
        mae:
          type: number
        rmse:
          type: number
        r2Score:
          type: number
        modelName:
          type: string
        lastTrained:
          type: string
      required:
        - accuracy
        - mae
        - rmse
        - r2Score
        - modelName
        - lastTrained

    Anomaly:
      type: object
      properties:
        id:
          type: integer
        date:
          type: string
        metric:
          type: string
        value:
          type: number
        expectedValue:
          type: number
        deviation:
          type: number
        severity:
          type: string
        description:
          type: string
      required:
        - id
        - date
        - metric
        - value
        - expectedValue
        - deviation
        - severity
        - description

    AnomalyStats:
      type: object
      properties:
        totalDetected:
          type: integer
        critical:
          type: integer
        warning:
          type: integer
        info:
          type: integer
        lastScanDate:
          type: string
        dataPointsAnalyzed:
          type: integer
      required:
        - totalDetected
        - critical
        - warning
        - info
        - lastScanDate
        - dataPointsAnalyzed
